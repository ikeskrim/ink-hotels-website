name: CI

# Every push and every pull request. The point of this file is that a claim in
# the README can be trusted: each number quoted there is produced by a step
# below, on a clean machine, from a clean clone.
on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch cancels the first: the older answer is not
# worth the minutes once it is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ── Static checks — no server needed ────────────────────────────────
      # Ordered cheapest-first so an obvious break fails in seconds rather
      # than after a four-minute build.

      - name: Encoding — no mojibake, no U+FFFD, no BOM
        run: node scripts/encoding-check.mjs

      - name: Secrets — nothing credential-shaped in the tree
        run: node scripts/secret-scan.mjs

      - name: Redirects — table parses, no duplicates, no loops
        run: node scripts/redirect-check.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # ── Everything below needs the site actually running ────────────────
      # `npm start` runs `prestart`, which refuses to serve a build whose
      # prerendered routes are missing from disk.

      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium

      - name: Start the production server
        run: |
          npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server never came up:"; cat /tmp/server.log; exit 1

      - name: Routes — every sitemap URL returns 200
        run: node scripts/smoke.mjs
        env:
          BASE: http://localhost:3000
          EXPECT: production

      - name: Metadata — no locale served English title or description
        run: node scripts/meta-check.mjs
        env:
          BASE: http://localhost:3000

      - name: Translation — leakage within the ceiling
        run: node scripts/i18n-leakage.mjs
        env:
          BASE: http://localhost:3000

      - name: Headings — no run-together accessible names
        run: node scripts/heading-check.mjs
        env:
          BASE: http://localhost:3000

      - name: Locale — language survives a switch, two clicks and a reload
        run: node scripts/locale-roundtrip.mjs
        env:
          BASE: http://localhost:3000

      - name: Redirects — every destination and anchor resolves
        run: node scripts/redirect-check.mjs
        env:
          BASE: http://localhost:3000

      - name: Reveals — nothing stays invisible
        run: node scripts/reveal-check.mjs
        env:
          BASE: http://localhost:3000

      - name: Media - every reference resolves, every quality is declared
        run: node scripts/check-media.mjs

      - name: Structured data — parses, required fields present, images resolve
        run: node --import tsx scripts/schema-check.mjs
        env:
          BASE: http://localhost:3000

      - name: Keyboard — every control answers the key it claims to
        run: node scripts/keyboard-check.mjs
        env:
          BASE: http://localhost:3000

      - name: Booking links — every Book control lands on the right room
        run: node --import tsx scripts/booking-check.mjs
        env:
          BASE: http://localhost:3000

      - name: Alt text — every image speaks, in the reader's language
        run: node scripts/alt-check.mjs
        env:
          BASE: http://localhost:3000

      # The morning review. Artifact only — never committed; see .gitignore.
      # `if: always()` so a red run still produces the pictures, which is when
      # somebody most wants to see what the page actually looked like.
      - name: Screenshots — eight routes, English and Greek
        if: always()
        run: node scripts/shots.mjs
        env:
          BASE: http://localhost:3000

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-screenshots
          path: qa/shots/
          retention-days: 7
          if-no-files-found: warn

      - name: Server log on failure
        if: failure()
        run: tail -60 /tmp/server.log || true

  # ── The two engines the main job never sees ──────────────────────────────
  # Separate, because installing WebKit and Firefox is most of its runtime and
  # the fast gates should stay fast.
  #
  # NON-BLOCKING ON PURPOSE, FOR NOW. `continue-on-error` is on so its first
  # runs report without gating anyone. Promote it — delete that one line — once
  # it has passed twice on main. A new cross-browser job that goes straight to
  # blocking is a job people learn to re-run rather than read.
  #
  # Firefox cannot be launched on the Windows box this was written on
  # ("spawn UNKNOWN"), so the local runs were WebKit-only. Linux here is the
  # first place both engines actually run.
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install WebKit and Firefox
        run: npx playwright install --with-deps webkit firefox

      - name: Start the production server
        run: |
          npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server never came up:"; cat /tmp/server.log; exit 1

      - name: Renders, stays quiet, keeps its booking links
        run: node scripts/cross-browser.mjs
        env:
          BASE: http://localhost:3000

      - name: Server log on failure
        if: failure()
        run: tail -60 /tmp/server.log || true
